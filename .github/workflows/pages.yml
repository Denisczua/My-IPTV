name: Publish main playlist mirror

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - playlist.m3u
      - scripts/build_playlist_site.py
      - scripts/ottplayer_export.py
      - scripts/personal_playlist.py
      - data/personal-*.json
      - data/oled-channels.json
      - data/main-catalogue.json
      - data/iptv-org-feed-languages.json
      - .github/workflows/pages.yml

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and copy the current main playlist without changing its content
        run: python scripts/build_playlist_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for artifact visibility in the deployment API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..15}; do
            visible=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq 'any(.artifacts[]; .name == "github-pages" and .expired == false)')
            if [ "$visible" = "true" ]; then exit 0; fi
            sleep 3
          done
          echo 'Pages artifact is not visible; retaining any previously deployed site.'
          exit 1
      - name: Deploy validated mirror
        id: deployment
        uses: actions/deploy-pages@v4

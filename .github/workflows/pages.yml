name: Publish main playlist mirror

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - playlist.m3u
      - scripts/build_playlist_site.py
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and copy the current main playlist without changing its content
        run: python scripts/build_playlist_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy validated mirror
        id: deployment
        uses: actions/deploy-pages@v4

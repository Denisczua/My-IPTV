name: Update Czech movie playlist

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: movies-ru-cz
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch && vars.CZ_CHECKS_ENABLED == 'true'
    runs-on: [self-hosted, Windows, X64, iptv-cz]
    timeout-minutes: 45
    env:
      OUTPUT_BRANCH: codex/movies-ru-cz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/movies-ru-cz
      - name: Check streams and rebuild playlist
        shell: powershell
        run: |
          git fetch origin "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/update_movies.py --confirm-direct-cz --source-ref FETCH_HEAD
      - name: Publish verified results
        shell: powershell
        run: |
          git add -- playlist-movies-ru-cz-report.md data/movies-cz-checks.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tracked = git ls-files -- playlist-movies-ru-cz.m3u
          if ($tracked -or (Test-Path playlist-movies-ru-cz.m3u)) {
            git add -- playlist-movies-ru-cz.m3u
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh Czech movie playlist'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git pull --rebase origin "$env:OUTPUT_BRANCH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:$env:OUTPUT_BRANCH"

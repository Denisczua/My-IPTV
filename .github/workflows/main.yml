name: Update IPTV Playlist

on:
  workflow_dispatch:
    inputs:
      max_streams:
        type: number
        default: 40
      budget_seconds:
        type: number
        default: 1500
      movies_only:
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main, codex/movies-hd]
    paths:
      - scripts/**
      - tests/**
      - channels.json
      - data/movie-providers.json
      - data/movie-reviews.json
      - .github/workflows/main.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  update:
    concurrency:
      group: iptv-main-writer
      cancel-in-progress: false
    needs: validate
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update the existing main playlist and reserve catalogue
        run: python scripts/update_playlist.py
      - name: Refresh existing derived RU UA catalogue
        run: python scripts/filter_ru_ua.py --refresh-metadata
      - name: Publish validated main and existing derived playlists
        shell: bash
        run: |
          git add -- playlist.m3u backups data playlist-ru-ua-testing.m3u playlist-movies-report.md
          if [ -f playlist-ru-ua.m3u ]; then git add -- playlist-ru-ua.m3u; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh main IPTV catalogue and reviewed movie streams'
          git pull --rebase origin '${{ github.event.repository.default_branch }}'
          git push origin HEAD:${{ github.event.repository.default_branch }}
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: main-update-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/*report.json
            data/movie-source-audit.json
            data/reports/*failed.json
          retention-days: 7

  publish-pages:
    needs: update
    if: needs.update.result == 'success'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

